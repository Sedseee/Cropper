name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4 # Updated from v3

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Updated from v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4 # Updated from v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # This was the specific fix for your error
        with:
          name: webtoon-cropper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
