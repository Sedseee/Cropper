<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Webtoon Cropper Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        *{ box-sizing:border-box; margin:0; padding:0; }
        body{ font-family:Arial,sans-serif; background:#0a0a0a; color:white; min-height:100vh; overflow-x:hidden; }
        header{ background:linear-gradient(135deg,#1a1a2e,#16213e); padding:15px; text-align:center; font-size:22px; font-weight:bold; border-bottom:2px solid #e94560; }
        .section{ padding:15px; border-bottom:1px solid #333; }
        .section-title{ font-size:16px; margin-bottom:10px; color:#e94560; }
        .btn{ padding:12px 20px; margin:5px; font-size:15px; border:none; border-radius:8px; cursor:pointer; transition:0.3s; }
        .btn-primary{ background:#e94560; color:white; }
        .btn-secondary{ background:#333; color:white; }
        .btn-success{ background:#00b894; color:white; }
        .btn-danger{ background:#d63031; color:white; }
        .btn:active{ transform:scale(0.95); }
        .hidden-input{ display:none; }
        #thumbnails{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; max-height:150px; overflow-y:auto; }
        .thumb{ position:relative; width:60px; height:80px; }
        .thumb img{ width:100%; height:100%; object-fit:cover; border-radius:5px; border:2px solid #333; }
        .thumb-number{ position:absolute; top:-5px; left:-5px; background:#e94560; color:white; width:20px; height:20px; border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center; }
        .thumb-remove{ position:absolute; top:-5px; right:-5px; background:#d63031; color:white; width:20px; height:20px; border-radius:50%; font-size:14px; border:none; cursor:pointer; }
        #canvasContainer{ width:100%; height:50vh; overflow:auto; background:#000; position:relative; border:2px solid #333; }
        #canvas{ display:block; }
        .line-info{ background:#1a1a2e; padding:10px; font-size:14px; text-align:center; }
        .zoom-controls{ display:flex; justify-content:center; gap:10px; padding:10px; background:#111; }
        .status{ text-align:center; padding:10px; background:#111; font-size:14px; color:#aaa; }
        .help-text{ background:#1a1a1a; padding:10px; font-size:13px; color:#888; text-align:center; border-bottom:1px solid #333; }
        .legend{ display:flex; justify-content:center; gap:20px; padding:10px; background:#111; font-size:12px; }
        .legend-item{ display:flex; align-items:center; gap:5px; }
        .legend-box{ width:20px; height:15px; border-radius:3px; }
    </style>
</head>
<body>

<header>🎨 Webtoon Cropper Pro</header>

<div class="help-text">
    ⚠️ Lines work in PAIRS: Line 1+2 = Panel 1, Line 3+4 = Panel 2, etc.
</div>

<div class="legend">
    <div class="legend-item">
        <div class="legend-box" style="background:rgba(0,184,148,0.4)"></div>
        <span>Panel (will export)</span>
    </div>
    <div class="legend-item">
        <div class="legend-box" style="background:rgba(255,165,0,0.4)"></div>
        <span>Unpaired line</span>
    </div>
</div>

<div class="section">
    <div class="section-title">📁 Step 1: Add Images</div>
    
    <input type="file" id="fileInputMultiple" class="hidden-input" accept="image/*" multiple>
    
    <input type="file" id="fileInputFolder" class="hidden-input" accept="image/*" webkitdirectory multiple>
    
    <button class="btn btn-primary" onclick="document.getElementById('fileInputMultiple').click()">+ Add Files</button>
    <button class="btn btn-primary" onclick="document.getElementById('fileInputFolder').click()">+ Add Folder</button>
    <button class="btn btn-danger" onclick="clearAllImages()">Clear All</button>
    
    <div id="thumbnails"></div>
    <div id="imageCount" style="margin-top:10px;color:#888;"></div>
</div>

<div class="section">
    <div class="section-title">🧵 Step 2: Stitch & Edit</div>
    <button class="btn btn-success" onclick="stitchImages()">Stitch Images</button>
    <button class="btn btn-secondary" onclick="addLineAtCenter()">+ Add Line</button>
    <button class="btn btn-secondary" onclick="deleteLastLine()">- Remove Line</button>
    <button class="btn btn-danger" onclick="clearAllLines()">Clear Lines</button>
</div>

<div id="canvasContainer">
    <canvas id="canvas"></canvas>
</div>

<div class="zoom-controls">
    <button class="btn btn-secondary" onclick="zoomOut()">➖ Zoom Out</button>
    <button class="btn btn-secondary" onclick="zoomReset()">⟲ Reset</button>
    <button class="btn btn-secondary" onclick="zoomIn()">➕ Zoom In</button>
</div>

<div class="line-info" id="lineInfo">
    Lines: 0 | Panels: 0 | Add lines in pairs to create panels
</div>

<div class="section">
    <div class="section-title">💾 Step 3: Export</div>
    <button class="btn btn-success" onclick="exportPanels()">📦 Export as ZIP</button>
    <div id="exportStatus" style="margin-top:10px;color:#888;"></div>
</div>

<div class="status" id="status">Ready. Add images to begin.</div>

<script>
/* ========== VARIABLES ========== */
let uploadedFiles = [];
let lines = [];
let selectedLine = null;
let scale = 1;
let baseScale = 1;

const fullCanvas = document.createElement("canvas");
const fullCtx = fullCanvas.getContext("2d");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const container = document.getElementById("canvasContainer");

const MIN_CROP_HEIGHT = 50;

/* ========== FILE HANDLING ========== */

// Centralized function to process files from either input
function processFiles(filesList) {
    const files = Array.from(filesList);
    if(files.length === 0) return;

    // Filter only images and sort them alphanumerically
    const imageFiles = files
        .filter(file => file.type.startsWith('image/'))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

    if (imageFiles.length === 0) {
        alert("No images found in your selection.");
        return;
    }

    imageFiles.forEach(file => {
        uploadedFiles.push(file);
    });

    renderThumbnails();
    updateStatus("Added " + imageFiles.length + " image(s)");
}

document.getElementById("fileInputMultiple").addEventListener("change", function(e){
    processFiles(e.target.files);
    this.value = ""; // Reset input
});

document.getElementById("fileInputFolder").addEventListener("change", function(e){
    processFiles(e.target.files);
    this.value = ""; // Reset input
});

function renderThumbnails(){
    const thumbContainer = document.getElementById("thumbnails");
    thumbContainer.innerHTML = "";
    
    uploadedFiles.forEach((file, index) => {
        const div = document.createElement("div");
        div.className = "thumb";
        
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        
        const num = document.createElement("div");
        num.className = "thumb-number";
        num.textContent = index + 1;
        
        const removeBtn = document.createElement("button");
        removeBtn.className = "thumb-remove";
        removeBtn.textContent = "×";
        removeBtn.onclick = () => removeImage(index);
        
        div.appendChild(img);
        div.appendChild(num);
        div.appendChild(removeBtn);
        thumbContainer.appendChild(div);
    });
    
    document.getElementById("imageCount").textContent = uploadedFiles.length + " image(s) ready";
}

function removeImage(index){
    uploadedFiles.splice(index, 1);
    renderThumbnails();
    updateStatus("Image removed");
}

function clearAllImages(){
    uploadedFiles = [];
    renderThumbnails();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width = 0;
    canvas.height = 0;
    fullCanvas.width = 0;
    fullCanvas.height = 0;
    lines = [];
    updateLineInfo();
    updateStatus("All images cleared");
}

/* ========== IMAGE LOADING ========== */
function loadImage(file){
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(file);
    });
}

/* ========== STITCHING ========== */
async function stitchImages(){
    if(uploadedFiles.length === 0){
        alert("Please add images first!");
        return;
    }
    
    updateStatus("Stitching " + uploadedFiles.length + " images...");
    const images = await Promise.all(uploadedFiles.map(loadImage));
    
    const width = Math.max(...images.map(img => img.width));
    const totalHeight = images.reduce((sum, img) => sum + img.height, 0);
    
    fullCanvas.width = width;
    fullCanvas.height = totalHeight;
    
    let y = 0;
    for(let img of images){
        fullCtx.drawImage(img, 0, y);
        y += img.height;
    }
    
    lines = [];
    
    // Calculate scale to fit width
    baseScale = container.clientWidth / fullCanvas.width;
    scale = baseScale;
    
    resizeAndDraw();
    updateStatus("Stitched! Tap to add lines. Lines work in PAIRS.");
}

/* ========== GET PANEL PAIRS ========== */
function getPanelPairs(){
    const sortedLines = [...lines].sort((a, b) => a - b);
    const pairs = [];
    
    for(let i = 0; i < sortedLines.length - 1; i += 2){
        pairs.push({
            top: sortedLines[i],
            bottom: sortedLines[i + 1],
            lineIndex1: i,
            lineIndex2: i + 1
        });
    }
    return pairs;
}

function getUnpairedLineIndex(){
    const sortedLines = [...lines].sort((a, b) => a - b);
    if(sortedLines.length % 2 === 1){
        return sortedLines.length - 1;
    }
    return -1;
}

/* ========== DRAWING ========== */
function resizeAndDraw(){
    canvas.width = fullCanvas.width * scale;
    canvas.height = fullCanvas.height * scale;
    ctx.drawImage(fullCanvas, 0, 0, canvas.width, canvas.height);
    drawLines();
}

function drawLines(){
    const sortedLines = [...lines].sort((a, b) => a - b);
    const pairs = getPanelPairs();
    const unpairedIndex = getUnpairedLineIndex();

    ctx.fillStyle = "rgba(0, 184, 148, 0.25)";
    pairs.forEach(pair => {
        const top = pair.top * scale;
        const bottom = pair.bottom * scale;
        ctx.fillRect(0, top, canvas.width, bottom - top);
    });

    if(unpairedIndex !== -1){
        const unpairedY = sortedLines[unpairedIndex] * scale;
        ctx.fillStyle = "rgba(255, 165, 0, 0.2)";
        ctx.fillRect(0, unpairedY - 20, canvas.width, 40);
    }

    sortedLines.forEach((y, i) => {
        const scaledY = y * scale;
        const isPaired = i < sortedLines.length - (sortedLines.length % 2);
        
        if(isPaired){
            ctx.strokeStyle = "#00b894";
        } else {
            ctx.strokeStyle = "#ffa500";
        }
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 5]);
        ctx.beginPath();
        ctx.moveTo(0, scaledY);
        ctx.lineTo(canvas.width, scaledY);
        ctx.stroke();
        
        ctx.setLineDash([]);
        ctx.fillStyle = isPaired ? "#00b894" : "#ffa500";
        ctx.fillRect(5, scaledY - 12, 35, 20);
        ctx.fillStyle = "white";
        ctx.font = "bold 11px Arial";
        ctx.fillText("L" + (i + 1), 10, scaledY + 3);
    });

    ctx.font = "bold 16px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    pairs.forEach((pair, i) => {
        const centerY = ((pair.top + pair.bottom) / 2) * scale;
        
        ctx.fillStyle = "rgba(0, 184, 148, 0.8)";
        ctx.fillRect(canvas.width / 2 - 40, centerY - 12, 80, 24);
        ctx.fillStyle = "white";
        ctx.fillText("Panel " + (i + 1), canvas.width / 2, centerY + 5);
    });
    ctx.textAlign = "left";
    ctx.setLineDash([]);
    updateLineInfo();
}

function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(fullCanvas, 0, 0, canvas.width, canvas.height);
    drawLines();
}

/* ========== LINE CONTROLS ========== */
canvas.addEventListener("click", function(e){
    if(fullCanvas.width === 0) return;
    const rect = canvas.getBoundingClientRect();
    const y = (e.clientY - rect.top) / scale;
    
    for(let i = 0; i < lines.length; i++){
        if(Math.abs(lines[i] - y) < 20 / scale){
            return;
        }
    }
    
    lines.push(y);
    lines.sort((a, b) => a - b);
    redraw();
    
    const pairs = getPanelPairs();
    if(lines.length % 2 === 0){
        updateStatus("Line " + lines.length + " added. Panel " + pairs.length + " created!");
    } else {
        updateStatus("Line " + lines.length + " added. Add another to complete panel.");
    }
});

canvas.addEventListener("touchstart", function(e){
    if(lines.length === 0) return;
    const rect = canvas.getBoundingClientRect();
    const touchY = (e.touches[0].clientY - rect.top) / scale;
    
    for(let i = 0; i < lines.length; i++){
        if(Math.abs(lines[i] - touchY) < 30 / scale){
            selectedLine = i;
            e.preventDefault();
            break;
        }
    }
}, {passive: false});

canvas.addEventListener("touchmove", function(e){
    if(selectedLine !== null){
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        let newY = (e.touches[0].clientY - rect.top) / scale;
        
        newY = Math.max(10, Math.min(fullCanvas.height - 10, newY));
        lines[selectedLine] = newY;
        
        lines.sort((a, b) => a - b);
        selectedLine = lines.indexOf(newY);
        redraw();
    }
}, {passive: false});

canvas.addEventListener("touchend", function(){
    if(selectedLine !== null){
        updateStatus("Line moved");
    }
    selectedLine = null;
});

function addLineAtCenter(){
    if(fullCanvas.height === 0){
        alert("Stitch images first!");
        return;
    }
    
    let newY;
    if(lines.length === 0){
        newY = fullCanvas.height * 0.3;
    } else {
        const sortedLines = [...lines].sort((a,b) => a-b);
        const lastLine = sortedLines[sortedLines.length - 1];
        newY = lastLine + 200;
        if(newY > fullCanvas.height - 50){
            newY = fullCanvas.height * 0.5;
        }
    }
    
    lines.push(newY);
    lines.sort((a, b) => a - b);
    redraw();
    
    const pairs = getPanelPairs();
    if(lines.length % 2 === 0){
        updateStatus("Line added. Panel " + pairs.length + " created!");
    } else {
        updateStatus("Line added. Add another to complete panel.");
    }
}

function deleteLastLine(){
    if(lines.length === 0){
        alert("No lines to remove");
        return;
    }
    lines.pop();
    redraw();
    updateStatus("Last line removed");
}

function clearAllLines(){
    lines = [];
    redraw();
    updateStatus("All lines cleared");
}

function updateLineInfo(){
    const info = document.getElementById("lineInfo");
    const pairs = getPanelPairs();
    const unpaired = lines.length % 2 === 1;
    
    let html = "Lines: " + lines.length + " | ";
    
    if(pairs.length > 0){
        html += "<span style='color:#00b894'>Panels: " + pairs.length + "</span>";
    } else {
        html += "Panels: 0";
    }
    
    if(unpaired){
        html += " | <span style='color:#ffa500'>1 line waiting for pair</span>";
    }
    
    info.innerHTML = html;
}

/* ========== ZOOM ========== */
function zoomIn(){
    scale *= 1.3;
    resizeAndDraw();
}

function zoomOut(){
    scale *= 0.7;
    if(scale < 0.1) scale = 0.1;
    resizeAndDraw();
}

function zoomReset(){
    scale = baseScale;
    resizeAndDraw();
}

/* ========== EXPORT ========== */
async function exportPanels(){
    if(fullCanvas.width === 0){
        alert("Stitch images first!");
        return;
    }
    
    const pairs = getPanelPairs();
    if(pairs.length === 0){
        alert("No panels to export!\n\nYou need at least 2 lines to create 1 panel.\n\nCurrently you have " + lines.length + " line(s).");
        return;
    }
    
    const exportStatus = document.getElementById("exportStatus");
    exportStatus.textContent = "Preparing export...";
    
    const zip = new JSZip();
    let panelNum = 1;
    let exported = 0;
    
    for(let pair of pairs){
        const top = Math.round(pair.top);
        const bottom = Math.round(pair.bottom);
        const height = bottom - top;
        
        if(height < MIN_CROP_HEIGHT){
            continue;
        }
        
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = fullCanvas.width;
        tempCanvas.height = height;
        const tempCtx = tempCanvas.getContext("2d");
        
        tempCtx.drawImage(
            fullCanvas,
            0, top, fullCanvas.width, height,
            0, 0, fullCanvas.width, height
        );
        
        const blob = await new Promise(resolve => 
            tempCanvas.toBlob(resolve, "image/png")
        );
        
        const fileName = "panel_" + String(panelNum).padStart(2, "0") + ".png";
        zip.file(fileName, blob);
        
        panelNum++;
        exported++;
        exportStatus.textContent = "Processing panel " + exported + "...";
    }
    
    if(exported === 0){
        alert("No valid panels to export. Lines may be too close together.");
        exportStatus.textContent = "";
        return;
    }
    
    exportStatus.textContent = "Creating ZIP file...";
    zip.generateAsync({type: "blob"}).then(content => {
        saveAs(content, "webtoon_panels.zip");
        exportStatus.textContent = "✅ Exported " + exported + " panel(s)!";
        updateStatus("Export complete! " + exported + " panel(s) saved.");
    });
}

/* ========== STATUS ========== */
function updateStatus(message){
    document.getElementById("status").textContent = message;
}
</script>
</body>
</html>
